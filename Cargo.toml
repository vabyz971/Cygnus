[workspace]
resolver = "3"
members = [
    "crates/ui-kit",
    "crates/commands",
    "crates/mcp-server",
    "crates/file-format",
    "photo/core",
    "photo/render",
    "photo/io",
    "apps/photo",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/vabyz971/Cygnus"
publish = false

# Internal crates, by path. Allowed edges follow docs/spec.md, section 7.4.
[workspace.dependencies]
cygnus-ui-kit = { path = "crates/ui-kit" }
cygnus-commands = { path = "crates/commands" }
cygnus-mcp-server = { path = "crates/mcp-server" }
cygnus-file-format = { path = "crates/file-format" }
cygnus-photo-core = { path = "photo/core" }
cygnus-photo-render = { path = "photo/render" }
cygnus-photo-io = { path = "photo/io" }

# User interface. egui, eframe and egui_dock are pinned together (see
# docs/decisions/0004). egui's bundled fonts are disabled for licensing
# reasons, the theme ships its own (0006). Icons: Phosphor (0005).
egui = { version = "=0.36.2", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "wgpu",
    "wayland",
    "x11",
] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
egui-phosphor = { version = "=0.14.0", default-features = false, features = ["regular"] }

# Rendering. wgpu must be exactly the version egui-wgpu uses, so that the
# canvas shares eframe's device (docs/decisions/0015).
wgpu = "=30.0.1"
half = "2.7"
pollster = "1.0"
thiserror = "2.0"

# Serialization and configuration files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON schema of command parameters, source of the MCP tools (0010).
schemars = "1.2"
# Configuration directory per operating system (0007).
directories = "6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
