[workspace]
resolver = "2"
members = [
    "core/datatypes",
    "engines/photo-engine",
    "engines/video-engine",
    "engines/audio-engine",
    "engines/vector-engine",
    "engines/layout-engine",
    "packages/ui-kit",
    "packages/math-utils",
    "packages/file-utils",
    "packages/preferences",
    "apps/photo",
    "apps/video",
    "apps/audio",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
eframe = "=0.36.2"
egui = "=0.36.2"
egui_material_icons = { version = "=0.8.0", features = ["filled", "outline"] }
egui_animation = "=0.13.0"
egui_tiles = "=0.17.1"
rfd = "=0.15.4"
wgpu = "=30.0.1"
image = { version = "=0.25.10", features = ["rayon"] }
rayon = "=1.12.0"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
thiserror = "=2.0.20"
log = "=0.4.34"
dirs = "=6.0.0"
