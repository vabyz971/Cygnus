name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      # Development headers used by eframe's windowing backends (winit).
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  linux-checks:
    name: License headers and dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: License headers
        run: scripts/check-headers.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.0"
          command: check

  # Renderer tests on a GPU adapter (docs/decisions/0013): lavapipe on Linux,
  # WARP on Windows, the runner's Metal device on macOS. CYGNUS_REQUIRE_GPU
  # turns a missing adapter into a failure instead of a skip.
  gpu:
    name: GPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            adapter: llvmpipe
          - os: windows-2022
            adapter: ""
          - os: macos-14
            adapter: ""
    runs-on: ${{ matrix.os }}
    env:
      CYGNUS_REQUIRE_GPU: "1"
      CYGNUS_ADAPTER: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - name: Install lavapipe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - name: GPU tests
        run: cargo test -p cygnus-photo-render --test gpu -- --nocapture
