# Cygnus — Release Photo
# A `v*` tag (e.g. `v0.9.0-alpha`) builds Cygnus Photo in release mode on
# Linux, Windows and macOS (Apple Silicon + Intel), packages each binary
# with the license and README, and publishes them on a GitHub Release
# (marked pre-release when the tag carries a suffix such as `-alpha`).
# The binary is self-contained (fonts and icons are embedded).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: cygnus-photo

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: photo
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: photo.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: photo
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: photo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev

      - name: Rust toolchain (stable, edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Cygnus Photo
        run: cargo build --release --locked -p photo --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="${APP}-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$dir/${APP}"
          cp LICENSE README.md "dist/$dir/" 2>/dev/null || true
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:APP-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$dir/$env:APP.exe"
          foreach ($f in @("LICENSE", "README.md")) { if (Test-Path $f) { Copy-Item $f "dist/$dir/" } }
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="${APP}-${GITHUB_REF_NAME}-${{ matrix.name }}"
          app="dist/$dir/Cygnus Photo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$app/Contents/MacOS/${APP}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Cygnus Photo</string>
            <key>CFBundleDisplayName</key><string>Cygnus Photo</string>
            <key>CFBundleIdentifier</key><string>org.cygnus.photo</string>
            <key>CFBundleExecutable</key><string>${APP}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          cp LICENSE README.md "dist/$dir/" 2>/dev/null || true
          (cd dist && zip -qry "$dir.zip" "$dir")

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cygnus Photo ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Cygnus Photo ${{ github.ref_name }} — alpha build for testing.

            Downloads:
            - Linux x86_64: `.tar.gz` (run `./cygnus-photo`; needs Vulkan, Wayland or X11)
            - Windows x86_64: `.zip` (run `cygnus-photo.exe`)
            - macOS Apple Silicon / Intel: `.zip` with `Cygnus Photo.app`
              (unsigned: right-click > Open the first time)

            Projects are saved as `.cygp` (format v9).
          files: dist/*
